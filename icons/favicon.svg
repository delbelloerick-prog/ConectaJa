<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4F4B"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#072725" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="4" stroke-dasharray="8 12"/>

  <!-- Center Card Badge -->
  <rect x="126" y="126" width="260" height="260" rx="64" fill="url(#amber)" filter="url(#shadow)"/>

  <!-- Check / Connect Symbol -->
  <path d="M196 260 L236 300 L320 208" fill="none" stroke="#0F2A27" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle dots representing connection / rating -->
  <circle cx="340" cy="155" r="14" fill="#FEF3C7"/>
  <circle cx="160" cy="350" r="10" fill="#FEF3C7"/>
</svg>